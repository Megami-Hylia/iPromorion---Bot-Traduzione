# Avvia soltanto il motore di traduzione; il bot Python gira sull'host.
# Immagine ufficiale, release stabile verificata il 17 settembre 2026.
services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    ports:
      # API raggiungibile solo da questo computer, senza pubblicarla su Internet.
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: "en,fr,it"
    volumes:
      # I modelli scaricati al primo avvio restano disponibili dopo i riavvii.
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD", "./venv/bin/python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Il primo avvio richiede tempo per scaricare e caricare i modelli.
      start_period: 10m

volumes:
  libretranslate_models:
